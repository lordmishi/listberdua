name: Ambil produk dari Google Sheet

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-products
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Baca sheet dan tulis products.json
        run: node scripts/sync-sheet.mjs

      - name: Simpan kalau ada perubahan
        run: |
          if git diff --quiet -- src/data/products.json; then
            echo "Tidak ada perubahan."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/products.json
          git commit -m "Perbarui produk dari Google Sheet"
          git push
